<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1eb">
  <meta name="description" content="Les confirmations pour notre mariage sont maintenant terminées.">
  <title>Confirmations terminées</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2f2925;
      background: #f6f1eb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(209, 184, 156, 0.28), transparent 38%),
        radial-gradient(circle at bottom right, rgba(188, 159, 129, 0.2), transparent 34%),
        #f6f1eb;
    }

    main {
      width: min(100%, 720px);
    }

    .notice {
      padding: clamp(36px, 7vw, 68px);
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(93, 72, 55, 0.12);
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(71, 53, 40, 0.12);
      backdrop-filter: blur(12px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      padding: 8px 14px;
      border: 1px solid rgba(117, 85, 60, 0.18);
      border-radius: 999px;
      color: #76573f;
      background: #f8f2eb;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #eee2d6;
      color: #76573f;
      font-size: 1.75rem;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 6vw, 3.6rem);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: #302822;
    }

    .lead {
      margin: 24px auto 0;
      max-width: 540px;
      font-size: clamp(1.08rem, 2.5vw, 1.3rem);
      line-height: 1.65;
      color: #5d5148;
    }

    .detail {
      margin: 14px auto 0;
      max-width: 540px;
      font-size: 1rem;
      line-height: 1.7;
      color: #74675d;
    }

    .divider {
      width: 54px;
      height: 1px;
      margin: 30px auto;
      background: rgba(117, 85, 60, 0.28);
    }

    .thanks {
      margin: 0;
      color: #4b4038;
      font-weight: 600;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .notice {
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="notice" aria-labelledby="notice-title" aria-describedby="notice-description">
      <span class="badge">Notre mariage</span>
      <div class="icon" aria-hidden="true">♡</div>
      <h1 id="notice-title">Les confirmations sont terminées</h1>
      <p class="lead" id="notice-description">Un grand merci à toutes et à tous d’avoir pris le temps de nous répondre.</p>
      <p class="detail">Le formulaire est maintenant fermé. Nous avons hâte de vous retrouver et de partager cette belle journée avec vous !</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="thanks">À très vite ♡</p>
    </section>
  </main>
</body>
</html>
